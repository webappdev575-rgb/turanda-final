[build]
command = "npx next build"
publish = ".next"
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_CLIENT_SECRET, NEXT_PUBLIC_GOOGLE_CLIENT_ID,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"
  # or disable entirely
  SECRETS_SCAN_ENABLED = false
[[plugins]]
package = "@netlify/plugin-nextjs"
[build.environment]
SECRETS_SCAN_OMIT_KEYS = "GOOGLE_CLIENT_SECRET,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"